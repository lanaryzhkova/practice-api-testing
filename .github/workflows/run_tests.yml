name: Run API Tests

on:
  push:
    branches: [ api-tests ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone test-service
        run: git clone https://github.com/sun6r0/test-service.git

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start backend
        run: |
          cd test-service
          docker compose up -d --build
          sleep 20

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/api/time >/dev/null; then
              echo "API is ready"
              break
            fi
            sleep 3
          done

      - name: Run tests
        env:
          BASE_URL: http://localhost:8080/api
        run: |
          cd api-tests
          pytest tests/ -v --alluredir=allure-results || true

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure

      - name: Generate report
        run: |
          cd api-tests
          allure generate allure-results -o allure-report

      - name: Deploy report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish_dir: api-tests/allure-report
          force_orphan: true

      - name: Stop backend
        if: always()
        run: |
          cd test-service
          docker compose down
