name: Run Tests and Publish Allure Report

on:
  push:
    branches: [api-tests]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest
          pip install -e .

      - name: Clone test-service repository
        run: |
          git clone https://github.com/sun6r0/test-service.git test-service

      - name: Start services with Docker Compose
        run: |
          cd test-service
          docker compose up -d --build
          sleep 20  # Даём время на запуск контейнеров

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/api/time >/dev/null; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 3
          done

      - name: Run tests
        env:
          BASE_URL: http://localhost:8080/api
        run: |
          python -m pytest -n 2 --alluredir=allure-results

      - name: Check allure-results
        run: |
          ls -la allure-results/

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          export PATH=$PATH:/opt/allure/bin
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        run: |
          /opt/allure/bin/allure generate allure-results --clean -o allure-report
          ls -la allure-report/

      - name: Verify Allure Report
        run: |
          if [ -f "allure-report/index.html" ]; then
            echo "Allure report generated successfully."
          else
            echo "Allure report generation failed."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          force_orphan: true

      - name: Stop services
        if: always()
        run: |
          cd test-service
          docker compose down
